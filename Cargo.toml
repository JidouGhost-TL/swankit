[workspace]
resolver = "2"
members = ["crates/ws-rom", "crates/ws-compress", "crates/ws-gfx", "crates/ws-sound", "crates/ws-text", "crates/ws-patch", "crates/ws-save", "crates/ws-saves", "crates/swankit", "crates/swankit-cli", "crates/swankit-py", "crates/swankit-ffi", "crates/ws-wondergate", "crates/ws-wondergate-server", "crates/ws-link", "crates/ws-platform", "crates/ws-assets", "crates/ws-discover"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
formatkit-core = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-layout = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-catalog = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-runtime = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-pixel = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-codec = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-corpus = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-corpus-test = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
formatkit-patch = { git = "https://github.com/JidouGhost-TL/formatkit.git", rev = "5f2b8e217766b558c68560989b6f80029290bc3c" }
