[workspace]
resolver = "2"
members = ["crates/ws-rom", "crates/ws-compress", "crates/ws-gfx", "crates/ws-sound", "crates/ws-text", "crates/ws-patch", "crates/ws-save", "crates/ws-saves", "crates/swankit", "crates/swankit-cli", "crates/swankit-py", "crates/swankit-ffi", "crates/ws-wondergate", "crates/ws-wondergate-server", "crates/ws-link", "crates/ws-assets", "crates/ws-discover"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
formatkit-core = "=0.1.1"
formatkit-layout = "=0.1.1"
formatkit-catalog = "=0.1.1"
formatkit-runtime = "=0.1.1"
formatkit-pixel = "=0.1.1"
formatkit-codec = "=0.1.1"
formatkit-corpus = "=0.1.1"
formatkit-corpus-test = "=0.1.1"
formatkit-patch = "=0.1.1"
