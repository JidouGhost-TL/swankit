[package]
name = "ws-discover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE"]
description = "Evidence-driven discovery of WonderSwan asset layouts"
readme = "README.md"

[dependencies]
formatkit-core.workspace = true
ws-assets = { path = "../ws-assets", version = "=0.1.2" }
ws-compress = { path = "../ws-compress", version = "=0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

[dev-dependencies]
formatkit-corpus-test.workspace = true
