[package]
name = "swankit-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
swankit = { path = "../swankit" }
formatkit-core.workspace = true
pyo3 = { version = "=0.27.2", features = ["abi3-py311"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
formatkit-corpus-test.workspace = true
