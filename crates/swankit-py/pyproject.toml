[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "swankit"
version = "0.1.2"
requires-python = ">=3.11"
description = "Private Python bindings for WonderSwan formats"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "release-licenses/**/*"]

[tool.maturin]
module-name = "swankit._native"
python-source = "python"
