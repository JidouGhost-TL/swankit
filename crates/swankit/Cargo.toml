[package]
name = "swankit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE"]
description = "WonderSwan cartridge, graphics, compression, audio, and save format toolkit"
readme = "README.md"

[features]
default = ["saves"]
saves = ["dep:ws-save", "dep:ws-saves"]

[dependencies]
formatkit-core.workspace = true
formatkit-catalog.workspace = true
formatkit-pixel.workspace = true
formatkit-runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ws-rom = { path = "../ws-rom", version = "=0.1.1" }
ws-discover = { path = "../ws-discover", version = "=0.1.1" }
ws-assets = { path = "../ws-assets", version = "=0.1.1" }
ws-compress = { path = "../ws-compress", version = "=0.1.1" }
ws-gfx = { path = "../ws-gfx", version = "=0.1.1" }
ws-text = { path = "../ws-text", version = "=0.1.1" }
ws-sound = { path = "../ws-sound", version = "=0.1.1" }
ws-patch = { path = "../ws-patch", version = "=0.1.1" }

[dev-dependencies]
formatkit-corpus-test.workspace = true

[dependencies.ws-save]
path = "../ws-save"
version = "=0.1.1"
optional = true

[dependencies.ws-saves]
path = "../ws-saves"
version = "=0.1.1"
optional = true
