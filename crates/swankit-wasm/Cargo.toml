[package]
name = "swankit-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly bindings for Swankit WonderSwan ROM, asset, save, and IPS patch operations"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
formatkit-core.workspace = true
formatkit-pixel.workspace = true
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
ws-assets = { path = "../ws-assets" }
ws-compress = { path = "../ws-compress" }
ws-gfx = { path = "../ws-gfx" }
ws-patch = { path = "../ws-patch" }
ws-rom = { path = "../ws-rom" }
ws-saves = { path = "../ws-saves" }
ws-sound = { path = "../ws-sound" }
ws-text = { path = "../ws-text" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
