[package]
name = "ws-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/build.rs", "/data/byte-pages-1.json", "/data/byte-prefix-1.json"]
description = "Data-defined WonderSwan character maps, text tables and font extraction"
readme = "README.md"

[dependencies]
formatkit-core.workspace = true
formatkit-layout.workspace = true
formatkit-catalog.workspace = true
ws-gfx = { path = "../ws-gfx", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "=0.8.35"
unicode-normalization = "=0.1.24"

[dev-dependencies]
formatkit-corpus-test.workspace = true
