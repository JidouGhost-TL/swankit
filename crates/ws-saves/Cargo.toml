[package]
name = "ws-saves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/build.rs", "/data/**", "!/data/hunter-x-hunter-*.json"]
description = "Generated game save layouts and checked semantic decoding"

[dependencies]
serde = { version = "1", features = ["derive"] }
formatkit-catalog.workspace = true
formatkit-core.workspace = true
formatkit-layout.workspace = true
ws-save = { path = "../ws-save", version = "=0.1.0" }
serde_json = "1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
sha2 = "0.10"
sha1 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
formatkit-corpus-test.workspace = true
