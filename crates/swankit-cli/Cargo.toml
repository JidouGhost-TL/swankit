[package]
name = "swankit-cli"
default-run = "swankit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND (MIT OR Apache-2.0)"
publish.workspace = true

[features]
default = ["saves"]
saves = ["swankit/saves"]

[dependencies]
ws-discover = { path = "../ws-discover" }
ws-wondergate = { path = "../ws-wondergate" }
ws-wondergate-server = { path = "../ws-wondergate-server", features = ["net"] }
swankit-ffi = { path = "../swankit-ffi" }
ws-assets = { path = "../ws-assets" }
formatkit-codec.workspace = true
formatkit-core.workspace = true
formatkit-catalog.workspace = true
formatkit-runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swankit = { path = "../swankit", default-features = false }

[dev-dependencies]
formatkit-corpus-test.workspace = true
miniz_oxide = "0.8"
crc = "3"

[[bin]]
name = "swankit"
path = "src/main.rs"

[[bin]]
name = "wg-adapter"
path = "src/bin/wg-adapter.rs"

[[bin]]
name = "wg-decode"
path = "src/bin/wg-decode.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ws-link = { path = "../ws-link" }

[target.'cfg(windows)'.dependencies]
ws-platform = { path = "../ws-platform" }
