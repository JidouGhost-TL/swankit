[package]
name = "swankit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["saves"]
saves = ["swankit/saves"]

[dependencies]
formatkit-core.workspace = true
formatkit-catalog.workspace = true
formatkit-runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swankit = { path = "../swankit", default-features = false }

[dev-dependencies]
formatkit-corpus-test.workspace = true
miniz_oxide = "0.8"
crc = "3"

[[bin]]
name = "swankit"
path = "src/main.rs"
